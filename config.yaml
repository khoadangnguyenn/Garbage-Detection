seed: 42

paths:
  raw: data/raw
  processed: data/processed
  manifest: data/processed/manifest.parquet
  splits: data/processed/splits.parquet
  manifest_clean: data/processed/manifest_clean.parquet
  splits_clean: data/processed/splits_clean.parquet
  features_dir: artifacts/features
  results: artifacts/probe_results.csv
  figures_dir: artifacts/figures
  report: REPORT.md

schema:
  size: [256, 256]
  mode: RGB
  format: PNG
  domains: [default, real_world]
  images_per_class_per_domain: 250

dedup:
  phash_size: 8
  phash_max_hamming: 6

split:
  stratify_by: fine_label
  group_by: group_id
  protocols:
    mixed:   {train: 0.70, val: 0.15, test: 0.15}
    d2r:     {val_frac_of_default: 0.15}   # train on default, test on real_world
    r2d:     {val_frac_of_real: 0.15}      # train on real_world, test on default

model:
  input_size: 224
  batch_size: 64
  probe_C: 1.0

task:
  scheme: three_class   # three_class | binary
  label_map:
    recyclable:
      - aluminum_soda_cans
      - aluminum_food_cans
      - steel_food_cans
      - glass_beverage_bottles
      - glass_food_jars
      - glass_cosmetic_containers
      - cardboard_boxes
      - cardboard_packaging
      - newspaper
      - office_paper
      - magazines
      - plastic_water_bottles
      - plastic_soda_bottles
      - plastic_detergent_bottles
      - plastic_food_containers
    organic:
      - coffee_grounds
      - eggshells
      - food_waste
      - tea_bags
    non_recyclable:
      - plastic_shopping_bags
      - plastic_trash_bags
      - plastic_straws
      - disposable_plastic_cutlery
      - plastic_cup_lids
      - styrofoam_cups
      - styrofoam_food_containers
      - paper_cups
      - clothing
      - shoes
      - aerosol_cans
